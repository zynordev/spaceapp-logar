name: keepalive

# Pings the Render demo so the free plan does not spin down before the jury.
# Runs only if the repository variable DEMO_URL is set (Settings > Variables).
# Note: GitHub may disable scheduled workflows in repositories with no recent
# activity; re-enable them in the Actions tab if that happens.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "DEMO_URL is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 60 --retry 2 "${DEMO_URL%/}/health"
